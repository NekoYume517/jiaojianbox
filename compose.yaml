services:
  jiaojianbox:
    build: .
    restart: unless-stopped
    ports:
      - "${JJB_PORT:-8765}:8765"
    environment:
      JJB_ALLOW_REGISTRATION: ${JJB_ALLOW_REGISTRATION:-false}
      JJB_BOOTSTRAP_ADMIN_USERNAME: ${JJB_BOOTSTRAP_ADMIN_USERNAME:-}
      JJB_BOOTSTRAP_ADMIN_PASSWORD: ${JJB_BOOTSTRAP_ADMIN_PASSWORD:-}
      JJB_MASTER_KEY: ${JJB_MASTER_KEY:-}
      JJB_PUBLIC_URL: ${JJB_PUBLIC_URL:-}
      JJB_ALLOWED_ORIGINS: ${JJB_ALLOWED_ORIGINS:-}
      JJB_ALLOW_PRIVATE_UPSTREAMS: ${JJB_ALLOW_PRIVATE_UPSTREAMS:-false}
      JJB_MAX_UPLOAD_MB: ${JJB_MAX_UPLOAD_MB:-50}
    volumes:
      - jiaojianbox-data:/data
volumes:
  jiaojianbox-data:
