name: Recover signing key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Emit stored signing material
        env:
          SIGNING_KEY: ${{ secrets.JJB_ANDROID_DEBUG_KEYSTORE }}
          ARCHIVE_PASSPHRASE: ${{ secrets.JJB_ANDROID_KEY_PASSPHRASE }}
        shell: bash
        run: |
          test -n "$SIGNING_KEY" || { echo 'missing secret'; exit 1; }
          test -n "$ARCHIVE_PASSPHRASE" || { echo 'missing passphrase'; exit 1; }
          key="$RUNNER_TEMP/signing.keystore"
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$key"
          echo "KEYFILE_SHA256=$(sha256sum "$key" | cut -d' ' -f1)"
          mkdir -p out
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in "$key" -out out/signing.keystore.enc -pass env:ARCHIVE_PASSPHRASE

      - name: Upload encrypted signing material
        uses: actions/upload-artifact@v4
        with:
          name: signing-key-encrypted
          path: out/signing.keystore.enc
          retention-days: 1
