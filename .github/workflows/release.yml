name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing version tag to publish after a packaging retry'
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  core:
    name: Go core and data compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -X utf8 scripts/verify-version.py
      - run: go test ./internal/api ./internal/store ./internal/setup -count=1
      - run: go vet ./internal/api ./internal/store ./internal/setup
      - run: go build ./cmd/jiaojianbox-server
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore stable Android signing key
        env:
          JJB_ANDROID_STABLE_KEYSTORE: ${{ secrets.JJB_ANDROID_STABLE_KEYSTORE }}
          JJB_ANDROID_DEBUG_KEYSTORE: ${{ secrets.JJB_ANDROID_DEBUG_KEYSTORE }}
          JJB_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.JJB_ANDROID_KEYSTORE_PASSWORD }}
          JJB_ANDROID_KEY_PASSWORD: ${{ secrets.JJB_ANDROID_KEY_PASSWORD }}
        run: |
          encoded="${JJB_ANDROID_STABLE_KEYSTORE:-$JJB_ANDROID_DEBUG_KEYSTORE}"
          test -n "$encoded" || { echo 'Stable Android signing key is required'; exit 1; }
          test -n "$JJB_ANDROID_KEYSTORE_PASSWORD" || { echo 'JJB_ANDROID_KEYSTORE_PASSWORD secret is required'; exit 1; }
          key="$RUNNER_TEMP/jiaojianbox-stable.keystore"
          printf '%s' "$encoded" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "JJB_ANDROID_KEYSTORE_PATH=$key" >> "$GITHUB_ENV"
          echo "JJB_ANDROID_KEYSTORE_PASSWORD=$JJB_ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          if [ -n "$JJB_ANDROID_KEY_PASSWORD" ]; then echo "JJB_ANDROID_KEY_PASSWORD=$JJB_ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"; fi

      - name: Verify stored signing identity matches the pinned certificate
        run: python -X utf8 scripts/verify-android-signing.py --keystore "$JJB_ANDROID_KEYSTORE_PATH"

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean signingReport assembleRelease --no-build-cache

      - name: Rename APK
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/JiaojianBox-${RELEASE_TAG}-android.apk"

      - name: Verify release APK signature and non-debuggable manifest
        run: python -X utf8 scripts/verify-android-signing.py --apk android/app/build/outputs/apk/release/app-release.apk --require-release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jiaojianbox-android
          path: dist/JiaojianBox-*-android.apk

  windows:
    name: Go Wails custom installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          npm ci

      - name: Run backend tests
        env:
          JJB_DATA_DIR: ${{ runner.temp }}/jjb-test
        run: python -m pytest tests -q

      - name: Verify Go packages and Windows GUI tests
        run: |
          go test ./internal/... ./cmd/... ./web -count=1
          go vet ./...

      - name: Verify version and frontend contracts
        run: |
          npm run verify:version
          npm run test:web

      - name: Verify browser experience
        run: |
          go build -o work/JiaojianBox-UISmoke.exe ./cmd/jiaojianbox-server
          npm run test:web:e2e

      - name: Verify legacy data upgrade and rollback
        run: |
          go build -o work/jiaojianbox-server.exe ./cmd/jiaojianbox-server
          python -X utf8 scripts/verify-go-migration.py

      - name: Package Windows desktop
        run: npm run package:win

      - name: Verify offline installer and collector dependencies
        run: python -X utf8 scripts/verify-installer.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jiaojianbox-win32-x64
          path: |
            artifacts/JiaojianBox-Setup-*-x64.exe
            artifacts/SHA256SUMS.txt

  release:
    name: Publish GitHub Release
    needs: [core, android, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    steps:
      - uses: actions/checkout@v4

      - name: Download windows artifact
        uses: actions/download-artifact@v4
        with:
          name: jiaojianbox-win32-x64
          path: dist

      - name: Download android artifact
        uses: actions/download-artifact@v4
        with:
          name: jiaojianbox-android
          path: dist

      - name: Write combined release checksums
        shell: bash
        run: |
          cd dist
          sha256sum JiaojianBox-Setup-*-x64.exe JiaojianBox-*-android.apk > SHA256SUMS.txt

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/JiaojianBox-Setup-*-x64.exe
            dist/JiaojianBox-*-android.apk
            dist/SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          body_path: docs/releases/${{ inputs.release_tag || github.ref_name }}.md
          generate_release_notes: true
          overwrite_files: false
          draft: false
          files: |
            dist/JiaojianBox-Setup-*-x64.exe
            dist/JiaojianBox-*-android.apk
            dist/SHA256SUMS.txt
