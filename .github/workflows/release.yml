name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing version tag to publish after a packaging retry'
        required: false
        type: string

permissions:
  contents: write

jobs:
  core:
    name: Go core and data compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - run: go test ./internal/api ./internal/store ./internal/setup -count=1
      - run: go vet ./internal/api ./internal/store ./internal/setup
      - run: go build ./cmd/jiaojianbox-server
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore stable Android signing key
        env:
          JJB_ANDROID_DEBUG_KEYSTORE: ${{ secrets.JJB_ANDROID_DEBUG_KEYSTORE }}
        run: |
          test -n "$JJB_ANDROID_DEBUG_KEYSTORE" || { echo 'Stable Android signing key is required'; exit 1; }
          key="$RUNNER_TEMP/jiaojianbox-debug.keystore"
          printf '%s' "$JJB_ANDROID_DEBUG_KEYSTORE" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "JJB_ANDROID_KEYSTORE_PATH=$key" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean signingReport assembleDebug --no-build-cache

      - name: Rename APK
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/JiaojianBox-${RELEASE_TAG}-android-debug.apk"

      - name: Verify APK uses the stable signing key
        shell: bash
        run: |
          expected=$(keytool -exportcert -keystore "$JJB_ANDROID_KEYSTORE_PATH" -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          actual=$("$signer" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d '\r' | xargs)
          echo "Expected signing certificate: $expected"
          echo "Actual signing certificate: $actual"
          test "$actual" = "$expected" || { echo 'APK signing certificate mismatch'; exit 1; }
          echo "Verified APK signing certificate: $actual"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jiaojianbox-android
          path: dist/JiaojianBox-*-android-debug.apk

  windows:
    name: Go Wails custom installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          npm ci

      - name: Run backend tests
        env:
          JJB_DATA_DIR: ${{ runner.temp }}/jjb-test
        run: python -m pytest tests -q

      - name: Verify legacy data upgrade and rollback
        run: |
          go build -o work/jiaojianbox-server.exe ./cmd/jiaojianbox-server
          python -X utf8 scripts/verify-go-migration.py

      - name: Package Windows desktop
        run: npm run package:win

      - name: Verify offline installer and collector dependencies
        run: python -X utf8 scripts/verify-installer.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jiaojianbox-win32-x64
          path: |
            artifacts/JiaojianBox-Setup-*-x64.exe
            artifacts/SHA256SUMS.txt

  release:
    name: Publish GitHub Release
    needs: [core, android, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    steps:
      - uses: actions/checkout@v4

      - name: Download windows artifact
        uses: actions/download-artifact@v4
        with:
          name: jiaojianbox-win32-x64
          path: dist

      - name: Download android artifact
        uses: actions/download-artifact@v4
        with:
          name: jiaojianbox-android
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          body_path: docs/releases/${{ inputs.release_tag || github.ref_name }}.md
          generate_release_notes: true
          overwrite_files: true
          draft: false
          files: |
            dist/JiaojianBox-Setup-*-x64.exe
            dist/JiaojianBox-*-android-debug.apk
            dist/SHA256SUMS.txt
