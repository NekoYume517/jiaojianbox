name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows desktop package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pypdf pillow httpx
          npm ci

      - name: Run backend tests
        run: python -m pytest tests -q

      - name: Package Windows desktop
        run: npm run package:win

      - name: Zip package
        shell: pwsh
        run: |
          Compress-Archive -Path "artifacts/JiaojianBox-win32-x64/*" -DestinationPath "JiaojianBox-${{ github.ref_name }}-win32-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jiaojianbox-win32-x64
          path: JiaojianBox-*-win32-x64.zip

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/JiaojianBox-${{ github.ref_name }}-android-debug.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jiaojianbox-android
          path: dist/JiaojianBox-*-android-debug.apk

  release:
    name: Publish GitHub Release
    needs: [windows, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download windows artifact
        uses: actions/download-artifact@v4
        with:
          name: jiaojianbox-win32-x64
          path: dist

      - name: Download android artifact
        uses: actions/download-artifact@v4
        with:
          name: jiaojianbox-android
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/JiaojianBox-*-win32-x64.zip
            dist/JiaojianBox-*-android-debug.apk
