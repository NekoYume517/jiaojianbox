name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore stable Android signing key
        env:
          JJB_ANDROID_DEBUG_KEYSTORE: ${{ secrets.JJB_ANDROID_DEBUG_KEYSTORE }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$JJB_ANDROID_DEBUG_KEYSTORE" ]; then
            printf '%s' "$JJB_ANDROID_DEBUG_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/JiaojianBox-${GITHUB_REF_NAME}-android-debug.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jiaojianbox-android
          path: dist/JiaojianBox-*-android-debug.apk

  windows:
    name: Windows desktop package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          npm ci

      - name: Run backend tests
        env:
          JJB_DATA_DIR: ${{ runner.temp }}/jjb-test
        run: python -m pytest tests -q

      - name: Package Windows desktop
        run: npm run package:win

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jiaojianbox-win32-x64
          path: |
            artifacts/JiaojianBox-Setup-*-x64.exe
            artifacts/latest.yml

  release:
    name: Publish GitHub Release
    needs: [android, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download windows artifact
        uses: actions/download-artifact@v4
        with:
          name: jiaojianbox-win32-x64
          path: dist

      - name: Download android artifact
        uses: actions/download-artifact@v4
        with:
          name: jiaojianbox-android
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          overwrite_files: false
          files: |
            dist/JiaojianBox-Setup-*-x64.exe
            dist/JiaojianBox-*-android-debug.apk
