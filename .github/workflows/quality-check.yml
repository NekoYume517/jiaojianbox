name: Quality Check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Version, frontend, Go and legacy compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install compatibility test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify version and frontend contracts
        run: npm test

      - name: Verify Go
        run: |
          go vet ./internal/api ./internal/store ./internal/setup
          go build ./cmd/jiaojianbox-server

      - name: Verify legacy compatibility
        run: python -m pytest tests -q

  windows-gui:
    name: Windows GUI package tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify Windows GUI tests
        run: |
          go test ./internal/gui -count=1
          go vet ./internal/gui
