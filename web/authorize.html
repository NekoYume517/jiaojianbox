<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>授权桌面客户端 · 交件箱</title>
  <script src="./theme.js"></script>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./app.css">
  <link rel="stylesheet" href="./palettes.css">
  <link rel="stylesheet" href="./workspace.css">
  <link rel="stylesheet" href="./motion.css">
</head>
<body>
  <main class="authorize-page">
    <div class="authorize-utilities"><div data-theme-picker></div></div>
    <section class="panel authorize-card">
      <img src="./icon.svg" alt="" width="44" height="44">
      <h1 id="authorize-title">授权桌面客户端</h1>
      <p id="authorize-description" class="helper">确认后，电脑上的交件箱可以同步此账号的通知、待办和材料。</p>

      <form id="authorize-login" class="authorize-login" hidden>
        <div class="authorize-step">第一步</div>
        <div class="chart-mode authorize-auth-tabs" role="tablist" aria-label="账号操作"><button id="authorize-signin-tab" type="button" role="tab" aria-selected="true" class="active">登录</button><button id="authorize-signup-tab" type="button" role="tab" aria-selected="false" tabindex="-1" hidden>注册</button></div>
        <h2 id="authorize-form-title">登录网页账号</h2>
        <label><span id="authorize-username-caption">邮箱 / 原有用户名</span><input id="authorize-username" required minlength="3" maxlength="64" autocomplete="username" placeholder="你的用户名"></label>
        <label>密码<input id="authorize-password" type="password" required minlength="10" autocomplete="current-password" placeholder="至少 10 位"></label>
        <label id="authorize-invitation-label" hidden>邀请码<input id="authorize-invitation" maxlength="128" autocomplete="off" placeholder="管理员提供的邀请码"></label><p id="authorize-mail-note" class="helper" role="status" hidden></p>
        <button class="primary full" data-motion-key="authorize-submit" id="authorize-login-submit" type="submit">登录并继续</button>
        <a class="link" href="/">打开网页工作台</a>
      </form>

      <section id="authorize-consent" hidden>
        <div class="authorize-step">第二步</div>
        <h2>确认这次登录</h2>
        <div id="authorize-code" class="device-code">— — — —</div>
        <p id="authorize-account" class="helper"></p>
        <div class="detail-actions">
          <button id="authorize-approve" class="primary">允许登录</button>
          <button id="authorize-deny" class="secondary">取消</button>
        </div>
      </section>

      <section id="authorize-complete" hidden>
        <h2>请求已处理</h2>
        <p id="authorize-complete-text" class="helper">可以返回电脑客户端继续。</p>
        <a class="link" href="/">打开网页工作台</a>
      </section>

      <p id="authorize-status" class="helper" role="status">正在读取授权请求…</p>
      <p id="authorize-error" class="error" role="alert" hidden></p>
    </section>
  </main>
  <script src="./motion.js" defer></script>
  <script src="./authorize.js" defer></script>
</body>
</html>
