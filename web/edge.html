<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>交件箱快捷收集</title><link rel="stylesheet" href="edge.css"><script defer src="edge.js"></script></head><body><button id="tab" aria-label="打开快捷收集">收<br>纳</button><main hidden id="panel"><header><strong>快捷收集</strong><button id="collapse" aria-label="收起">×</button></header><p class="muted">拖入文件，AI 帮你匹配待办</p><button id="choose" class="drop">拖到这里，或点击选择文件</button><p id="status" role="status" class="muted">Ctrl + Alt + Space 随时呼出</p><form id="quick"><textarea id="text" rows="2" maxlength="2000" placeholder="随手记一条通知或待办…" aria-label="快捷内容"></textarea><div class="actions"><button name="kind" value="note" type="submit">存通知</button><button name="kind" value="task" type="submit">建待办</button></div></form><div id="content"></div><footer><button id="refresh">刷新</button><button id="main">打开完整工作台</button></footer></main></body></html>
