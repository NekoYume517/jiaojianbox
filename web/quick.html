<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self';style-src 'self';img-src 'self' data:;connect-src 'self' http: https:;"><title>快捷收集</title><script src="./native.js"></script><script src="./theme.js"></script><link rel="stylesheet" href="./palettes.css"><link rel="stylesheet" href="./quick.css"><script src="./quick.js" defer></script></head>
<body data-file-drop-target><header class="quick-title"><img src="./icon.svg" width="20" height="20" alt=""><strong>快捷收集</strong><button id="quick-main" type="button" aria-label="打开主窗口" title="打开主窗口">↗</button><button id="quick-close" type="button" aria-label="关闭" title="关闭">×</button></header><main><button id="quick-choose" class="quick-drop" type="button" data-file-drop-target><span>拖入文件</span><small>或点击选择文件</small></button><form id="quick-note"><label for="quick-text">随手记</label><textarea id="quick-text" rows="2" maxlength="2000" placeholder="记下待办或一段通知"></textarea><div class="quick-actions"><button value="note" type="submit">存为通知</button><button value="task" type="submit">新建待办</button></div></form><section id="quick-files" aria-label="最近文件"></section></main><footer id="quick-status" role="status">文件收下后会保持打开，按 Esc 关闭</footer></body></html>
