<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>安装交件箱</title><style>
:root{color-scheme:dark;--bg:#1a1b26;--panel:#24283b;--ink:#c0caf5;--muted:#a9b1d6;--accent:#7aa2f7;--line:#414868;font:14px/1.6 'Segoe UI','Microsoft YaHei UI',sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}header{height:48px;padding:0 22px;display:flex;align-items:center;border-bottom:1px solid var(--line);--wails-draggable:drag;font-size:12px;gap:10px}header img{width:20px;height:20px}button{font:inherit;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 16px}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}header button{margin-left:auto;border:0;padding:5px 9px;--wails-draggable:no-drag}main{padding:34px 40px}h1{font-weight:550;font-size:30px;line-height:1.4;margin:0 0 12px}p{color:var(--muted);font-size:13px;margin:0 0 28px}.version{font-size:11px;color:var(--accent);letter-spacing:.08em;margin-bottom:12px}.path{display:flex;gap:8px;margin:8px 0 18px}input[type=text]{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);padding:10px;color:var(--ink);font:inherit}label{font-size:12px}input[type=checkbox]{accent-color:var(--accent)}.options{display:flex;gap:24px}.foot{position:absolute;bottom:0;left:0;right:0;border-top:1px solid var(--line);padding:20px 40px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted)}.primary{background:var(--accent);border-color:var(--accent);color:#1a1b26;font-weight:600;min-width:120px}progress{width:100%;height:5px;appearance:none;margin:25px 0 12px}progress::-webkit-progress-bar{background:var(--line)}progress::-webkit-progress-value{background:var(--accent)}#error{color:#f7768e;font-size:12px;white-space:pre-wrap;margin-top:15px}#progress-text{font-size:12px;color:var(--muted)}[hidden]{display:none!important}@media(prefers-color-scheme:light){:root{color-scheme:light;--bg:#f4f5fa;--panel:#e9edf7;--ink:#303854;--muted:#5b6480;--accent:#315bba;--line:#ccd2e2}.primary{color:white}}
</style></head><body><header><img src="icon.png" alt="">交件箱安装<button id="close" aria-label="关闭">×</button></header><main><div class="version" id="version">交件箱</div><h1 id="heading">通知、待办与文件，一处整理。</h1><p id="intro">安装后即可离线使用，也可以登录账号同步到其他设备。</p><section id="options"><label for="directory">安装位置</label><div class="path"><input id="directory" type="text" spellcheck="false"><button id="choose">浏览</button></div><div class="options"><label><input type="checkbox" id="desktop" checked> 创建桌面快捷方式</label><label><input type="checkbox" id="start-menu" checked> 添加到开始菜单</label></div></section><section id="status" hidden><progress id="progress" value="0" max="100"></progress><div id="progress-text">正在准备安装…</div></section><div id="error" role="alert"></div></main><footer class="foot"><span id="footnote">完整离线安装包 · QQ 与微信采集组件已内置</span><button class="primary" id="install">开始安装</button></footer><script type="module" src="setup.js"></script></body></html>
